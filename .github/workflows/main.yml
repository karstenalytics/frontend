name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check for chart code changes
        id: changes
        run: |
          # Compare with parent commit to detect non-data changes
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "FORCE")
          if echo "$CHANGED" | grep -qvE '^static/data/'; then
            echo "og_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "og_needed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping OG generation (only data files changed)"
          fi
      - name: Build site
        run: npm run build
      - name: Install Playwright
        if: steps.changes.outputs.og_needed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Generate OG images
        if: steps.changes.outputs.og_needed == 'true'
        run: node scripts/generate-og-images.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
